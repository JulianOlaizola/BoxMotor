services:
  - type: web
    name: boxmotor-backend
    env: node
    region: ohio
    rootDir: backend
    buildCommand: "npm install --include=dev && npm run build"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

# Migraciones: tras el despliegue inicial, ejecutar en la consola de Render
# (Shell del servicio): npm run migrate
# Aplica backend/migrations/001_initial.sql (idempotente, usa schema_migrations).
